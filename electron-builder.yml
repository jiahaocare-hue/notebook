appId: com.example.task-manager
productName: Task Manager
copyright: Copyright © 2024

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - "!**/*.ts"
  - "!**/*.map"

extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Task Manager

mac:
  target:
    - dmg
  icon: resources/icon.svg

linux:
  target:
    - AppImage

publish:
  provider: github
  owner: jiahaocare-hue
  repo: notebook
  releaseType: release
